name: Publicar aplicativos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-apps
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar versão
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Gerar e verificar instalador
        shell: pwsh
        run: |
          npm run build:installer
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o instalador.' }
          $installer = Start-Process -FilePath (Resolve-Path .\dist\JosueApp-Setup.exe) -ArgumentList '--verify' -PassThru -Wait -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw 'O instalador não passou na verificação.' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/JosueApp-Setup.exe
            dist/JosueApp-windows-x64.zip
          if-no-files-found: error

  mac:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Gerar instalador macOS
        run: bash tools/build-mac.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: dist/JosueApp-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            'dist/JosueApp-Setup.exe#Instalador para Windows' \
            'dist/JosueApp-windows-x64.zip#Pacote portátil para Windows' \
            'dist/JosueApp-mac-arm64.dmg#Instalador para Mac com Apple Silicon' \
            'dist/JosueApp-mac-x64.dmg#Instalador para Mac com Intel' \
            --target "$GITHUB_SHA" \
            --title "Josué App $RELEASE_TAG" \
            --notes 'Baixe o instalador correspondente ao seu computador.' \
            --latest
