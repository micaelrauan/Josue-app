name: Publicar atualização do Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar se a versão já foi publicada
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida: $version" }
          $tag = "v$version"
          $ErrorActionPreference = 'Continue'
          gh release view $tag --json tagName --jq .tagName 2>$null | Out-Null
          $status = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          $global:LASTEXITCODE = 0
          if ($status -eq 0) {
            Write-Host "$tag já foi publicada."
            "publish=false" >> $env:GITHUB_OUTPUT
          } elseif ($status -eq 1) {
            "publish=true" >> $env:GITHUB_OUTPUT
          } else {
            throw "Não foi possível consultar a Release $tag."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Executar testes
        if: steps.release.outputs.publish == 'true'
        run: npm test
      - name: Gerar instalador e pacote portátil
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        run: |
          npm run build:installer
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar o instalador.' }
          $installer = Start-Process -FilePath (Resolve-Path .\dist\JosueApp-Setup.exe) -ArgumentList '--verify' -PassThru -Wait -WindowStyle Hidden
          if ($installer.ExitCode -ne 0) { throw 'O instalador gerado não passou na verificação.' }
      - name: Publicar Release
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create $env:RELEASE_TAG `
            'dist/JosueApp-Setup.exe#Instalador do Josué App' `
            'dist/JosueApp-windows-x64.zip#Pacote portátil do Josué App' `
            --target $env:GITHUB_SHA `
            --title "Josué App $env:RELEASE_TAG" `
            --notes 'Instale pelo arquivo JosueApp-Setup.exe. Quem já usa o aplicativo receberá o aviso de atualização automaticamente.' `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar a Release.' }
