<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101113" />
  <title>Josué App</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/studio.css" />
</head>
<body>
  <div class="app-shell">
    <div class="titlebar"><span class="titlebar-tab">Josué App</span></div>
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div><strong>josué</strong></div>
      <nav id="main-nav">
        <button data-page="setlists" class="nav-item active"><span class="nav-icon" data-icon="list"></span>Setlists</button>
        <button data-page="studio" class="nav-item"><span class="nav-icon" data-icon="studio"></span>Studio</button>
        <button data-page="upload" class="nav-item"><span class="nav-icon" data-icon="plus"></span>Adicionar música</button>
        <div class="nav-label setlist-label">SUAS SETLISTS</div>
        <button id="new-setlist" class="nav-item"><span class="nav-icon accent" data-icon="plus"></span>Nova setlist</button>
        <div id="setlist-nav"></div>
      </nav>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <input id="audio-input" type="file" accept="audio/*,.mp3,.wav,.flac,.m4a,.wma" multiple hidden />
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
